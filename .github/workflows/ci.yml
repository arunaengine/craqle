# Runs Craqle's feature, style, documentation, lint, formatting, and MSRV gates.
# Copyright (c) 2026 ArunaStorage Team @ JLU Giessen
# SPDX-License-Identifier: MIT

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: 2

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -B scripts/style/tests.py
      - run: python3 -B scripts/style/checker.py

  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: none
            features: ""
          - profile: search
            features: search
          - profile: iroh
            features: iroh
          - profile: shacl
            features: shacl-core
          - profile: search-iroh
            features: search,iroh
          - profile: search-shacl
            features: search,shacl-core
          - profile: iroh-shacl
            features: iroh,shacl-core
          - profile: all
            features: search,iroh,shacl-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - if: matrix.features == ''
        run: cargo test --locked --no-default-features
      - if: matrix.features != ''
        run: cargo test --locked --no-default-features --features '${{ matrix.features }}'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: clippy,rustfmt
      - run: cargo +nightly fmt --all -- --check
      - run: cargo +nightly clippy --locked --all-features --all-targets -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - run: cargo test --locked --all-features --doc
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --all-features --no-deps

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - run: cargo check --locked --all-features --all-targets
