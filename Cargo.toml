[workspace]
resolver = "3"

[workspace.dependencies]
# RDF ecosystem
oxrdf = { version = "0.3.3", features = ["serde"] }
oxjsonld = "0.2.5"
spargebra = "0.4.6"
spareval = { version = "0.2.6", features = ["sep-0006"] }

# Storage
fjall = "3.1.8"
postcard = { version = "1.1.3", features = ["alloc"] }

# Search
tantivy = "0.26.1"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Identity
uuid = { version = "1.24.1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4.45", features = ["serde"] }

# Hashing
blake3 = "1.8.6"

# Error handling
thiserror = "2.0.20"
anyhow = "1.0.104"
globset = "0.4.20"
tracing = "0.1.44"
tokio = "1.53.1"

# RO-Crate implementation
rocraters = { package = "ro-crate-rs", git = "https://github.com/intbio-ncl/ro-crate-rs.git", tag = "v0.6.0", features = [
    "rdf",
] }

# Testing
proptest = "1.11.0"
tempfile = "3.27.0"

[patch."https://github.com/intbio-ncl/ro-crate-rs.git"]
ro-crate-rs = { path = "vendor/ro-crate-rs-0.6.0" }

[patch.crates-io]
shacl = { path = "vendor/shacl-0.3.8" }

[package]
name = "craqle"
version = "0.1.1"
edition = "2024"
license = "MIT"

[features]
default = ["search"]
search = ["dep:tantivy"]
iroh = ["irokle/iroh"]
shacl-core = ["dep:shacl", "dep:rudof_rdf", "dep:rudof_iri"]

[dependencies]
blake3 = { workspace = true }
chrono = { workspace = true }
fjall = { workspace = true }
irokle = { git = "https://github.com/arunaengine/irokle.git", branch = "main", features = [
    "fjall",
] }
oxrdf = { workspace = true }
oxjsonld = { workspace = true }
postcard = { workspace = true }
rocraters = { workspace = true }
shacl = { version = "=0.3.8", default-features = false, optional = true }
rudof_rdf = { version = "=0.3.8", default-features = false, optional = true }
rudof_iri = { version = "=0.3.8", default-features = false, optional = true }
serde_json = { workspace = true }
spargebra = { workspace = true }
spareval = { workspace = true }
tantivy = { workspace = true, optional = true }
globset = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
criterion = "0.8.2"
proptest = { workspace = true }
tempfile = { workspace = true }
iroh = "1.0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "partial_loading"
harness = false

[[bench]]
name = "large_rocrate_latency"
harness = false

[[bench]]
name = "sparql_hot_path"
harness = false

[[bench]]
name = "read_path_memory"
harness = false
