[workspace]
resolver = "3"

[workspace.dependencies]
# RDF ecosystem
oxrdf = { version = "0.3.3", features = ["serde"] }
spargebra = "0.4.6"
spareval = "0.2.6"

# Storage
fjall = "3.1.4"
postcard = { version = "1.1.3", features = ["alloc"] }

# Search
tantivy = "0.26.1"

# Serialization
serde = { version = "1.0.150", features = ["derive"] }
serde_json = "1.0.150"

# Identity
uuid = { version = "1.23.2", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4.45", features = ["serde"] }

# Hashing
blake3 = "1.8.5"

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.102"
globset = "0.4.18"
tracing = "0.1.44"

# RO-Crate implementation
rocraters = { package = "ro-crate-rs", git = "https://github.com/intbio-ncl/ro-crate-rs.git", branch = "main", features = [
    "rdf",
] }

# Testing
proptest = "1.11.0"
tempfile = "3.27.0"

[package]
name = "craqle"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["search"]
search = ["dep:tantivy"]
iroh = ["irokle/iroh"]

[dependencies]
blake3 = { workspace = true }
chrono = { workspace = true }
fjall = { workspace = true }
irokle = { git = "https://github.com/arunaengine/irokle.git", branch = "main", features = [
    "fjall",
] }
oxrdf = { workspace = true }
postcard = { workspace = true }
rocraters = { workspace = true }
serde_json = { workspace = true }
spargebra = { workspace = true }
spareval = { workspace = true }
tantivy = { workspace = true, optional = true }
globset = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
criterion = "0.8.2"
proptest = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "partial_loading"
harness = false

[[bench]]
name = "large_rocrate_latency"
harness = false
