[workspace]
resolver = "3"

[workspace.dependencies]
# RDF ecosystem
oxrdf = { version = "0.3.3", features = ["serde"] }
oxjsonld = "0.2.5"
oxsdatatypes = "0.2.2"
spargebra = "0.4.6"
spareval = { version = "0.2.6", features = ["sep-0006"] }

# Storage
fjall = "3.1.8"
postcard = { version = "1.1.3", features = ["alloc"] }

# Search
tantivy = "0.26.1"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Identity
uuid = { version = "1.24.1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4.45", features = ["serde"] }

# Hashing
blake3 = "=1.8.7"
regex = "1.13.1"

# Error handling
thiserror = "2.0.20"
anyhow = "1.0.104"
globset = "0.4.20"
tracing = "0.1.44"
tokio = "1.53.1"
rayon = "1.11.0"

# RO-Crate implementation
rocraters = { package = "ro-crate-rs", git = "https://github.com/arunaengine/ro-crate-rs.git", rev = "d60e99123d6e73d7730717ef30ce546da84e1177", features = [
    "rdf",
] }

# Testing
proptest = "1.11.0"
tempfile = "3.27.0"

[package]
name = "craqle"
version = "0.2.0-rc.1"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Versioned RDF graph storage, SPARQL, SHACL, and RO-Crate workflows"
repository = "https://github.com/arunaengine/craqle"
readme = "README.md"
keywords = ["rdf", "ro-crate", "sparql", "shacl", "crdt"]
categories = ["database", "data-structures", "science"]

[features]
default = ["search"]
search = ["dep:tantivy"]
iroh = ["irokle/iroh"]
shacl-core = [
    "dep:shacl",
    "dep:rudof_rdf",
    "dep:rudof_iri",
    "dep:regex",
    "dep:oxsdatatypes",
]

[dependencies]
blake3 = { workspace = true }
chrono = { workspace = true }
fjall = { workspace = true }
irokle = { git = "https://github.com/arunaengine/irokle.git", rev = "ebd4abd142f66816a16492c615525809f6c8b663", features = [
    "fjall",
] }
oxrdf = { workspace = true }
oxjsonld = { workspace = true }
oxsdatatypes = { workspace = true, optional = true }
postcard = { workspace = true }
rocraters = { workspace = true }
regex = { workspace = true, optional = true }
shacl = { version = "=0.3.10", default-features = false, optional = true }
rudof_rdf = { version = "=0.3.10", default-features = false, optional = true }
rudof_iri = { version = "=0.3.10", default-features = false, optional = true }
serde_json = { workspace = true }
spargebra = { workspace = true }
spareval = { workspace = true }
tantivy = { workspace = true, optional = true }
globset = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
criterion = "0.8.2"
proptest = { workspace = true }
tempfile = { workspace = true }
iroh = "1.0.3"
oxigraph = { version = "=0.5.9", default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "partial_loading"
harness = false

[[bench]]
name = "large_rocrate_latency"
harness = false

[[bench]]
name = "sparql_hot_path"
harness = false

[[bench]]
name = "read_path_memory"
harness = false

[[bench]]
name = "shacl_external_baseline"
harness = false
required-features = ["shacl-core"]

[[bench]]
name = "shacl_native_comparison"
harness = false
required-features = ["shacl-core"]

[[bench]]
name = "shacl_incremental"
harness = false
required-features = ["shacl-core"]

[[bench]]
name = "index_write_cost"
harness = false

[[bench]]
name = "query_result_collection"
harness = false

[[bench]]
name = "sparql_join_choice"
harness = false

[[bench]]
name = "sparql_access_path_scaling"
harness = false

[[bench]]
name = "oxigraph_comparison"
harness = false
