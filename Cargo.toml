[workspace]
members = [
    "crates/aruna-core",
    "crates/aruna-rdf-store",
    "crates/aruna-sparql",
    "crates/aruna-shacl",
    "crates/aruna-repl",
    "crates/aruna-search",
    "crates/aruna-sync",
    "crates/aruna-rocrate",
    "crates/aruna-tests",
]
resolver = "3"

[workspace.dependencies]
# RDF ecosystem
oxrdf = { version = "0.3", features = ["serde"] }
spargebra = "0.4"
spareval = "0.2"

# Storage
fjall = "3"
postcard = { version = "1", features = ["alloc"] }

# Search
tantivy = "0.25"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Identity
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Hashing
blake3 = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Local RO-Crate implementation
rocraters = { package = "ro-crate-rs", path = "/home/beavis/projects/ro-crate-rs", features = ["rdf"] }

# Testing
proptest = "1"
tempfile = "3"

# Internal crates
aruna-core = { path = "crates/aruna-core" }
aruna-rdf-store = { path = "crates/aruna-rdf-store" }
aruna-sparql = { path = "crates/aruna-sparql" }
aruna-shacl = { path = "crates/aruna-shacl" }
aruna-repl = { path = "crates/aruna-repl" }
aruna-search = { path = "crates/aruna-search" }
aruna-sync = { path = "crates/aruna-sync" }
aruna-rocrate = { path = "crates/aruna-rocrate" }

[package]
name = "rocratesync"
version = "0.1.0"
edition = "2024"

[dependencies]
aruna-sync = { workspace = true }
aruna-rocrate = { workspace = true }
aruna-search = { workspace = true }
aruna-core = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tempfile = { workspace = true }
