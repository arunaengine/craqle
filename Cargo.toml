[workspace]
resolver = "3"

[workspace.dependencies]
# RDF ecosystem
oxrdf = { version = "0.3", features = ["serde"] }
spargebra = "0.4"
spareval = "0.2"

# Storage
fjall = "3"
postcard = { version = "1", features = ["alloc"] }

# Search
tantivy = "0.25"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identity
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Hashing
blake3 = "1"

# Error handling
thiserror = "2"
anyhow = "1"
globset = "0.4"

# RO-Crate implementation
rocraters = { package = "ro-crate-rs", path = "/home/beavis/projects/ro-crate-rs", features = ["rdf"] }

# Testing
proptest = "1"
tempfile = "3"
