[workspace]
resolver = "3"

[workspace.dependencies]
# RDF ecosystem
oxrdf = { version = "0.3.4", features = ["rdf-12", "serde"] }
oxrdfio = { version = "0.2.6", features = ["rdf-12"] }
oxjsonld = "0.2.6"
oxsdatatypes = "0.2.3"
spargebra = { version = "0.4.7", features = ["sparql-12"] }
spareval = { version = "0.2.7", features = ["sep-0006", "sparql-12"] }

# Storage
fjall = "3.1.10"
postcard = { version = "1.1.3", features = ["alloc"] }

# Search
tantivy = "0.26.2"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Identity
uuid = { version = "1.26.1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4.45", features = ["serde"] }

# Hashing
blake3 = "=1.8.7"
regex = "1.13.1"

# Error handling
thiserror = "2.0.20"
anyhow = "1.0.104"
globset = "0.4.20"
tracing = "0.1.44"
tokio = "1.53.1"
rayon = "1.12.0"

# RO-Crate implementation
rocraters = { package = "ro-crate-rs", git = "https://github.com/arunaengine/ro-crate-rs.git", rev = "d60e99123d6e73d7730717ef30ce546da84e1177", features = [
    "rdf",
] }

# Testing
proptest = "1.11.0"
tempfile = "3.27.0"

[package]
autobenches = false
autotests = false
name = "craqle"
version = "0.3.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Versioned RDF graph storage, SPARQL, SHACL, and RO-Crate workflows"
repository = "https://github.com/arunaengine/craqle"
readme = "README.md"
keywords = ["rdf", "ro-crate", "sparql", "shacl", "crdt"]
categories = ["database", "data-structures", "science"]

[features]
default = ["search"]
search = ["dep:tantivy"]
allocation-metrics = []
iroh = ["irokle/iroh"]
shacl-core = [
    "dep:shacl",
    "dep:rudof_rdf",
    "dep:rudof_iri",
    "dep:regex",
    "dep:oxsdatatypes",
]

[dependencies]
blake3 = { workspace = true }
chrono = { workspace = true }
fjall = { workspace = true }
irokle = { git = "https://github.com/arunaengine/irokle.git", rev = "fd29484e9281524efa692f59025ac6cca2443da8", features = [
    "fjall",
] }
oxrdf = { workspace = true }
oxrdfio = { workspace = true }
oxjsonld = { workspace = true }
oxsdatatypes = { workspace = true, optional = true }
postcard = { workspace = true }
rocraters = { workspace = true }
regex = { workspace = true, optional = true }
shacl = { version = "=0.3.19", default-features = false, optional = true }
rudof_rdf = { version = "=0.3.19", default-features = false, optional = true }
rudof_iri = { version = "=0.3.19", default-features = false, optional = true }
serde_json = { workspace = true }
spargebra = { workspace = true }
spareval = { workspace = true }
tantivy = { workspace = true, optional = true }
globset = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
criterion = "0.8.2"
proptest = { workspace = true }
tempfile = { workspace = true }
iroh = "1.2.0"
oxigraph = { version = "=0.5.11", default-features = false, features = ["rdf-12"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

