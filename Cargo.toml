[workspace]
resolver = "3"

[workspace.dependencies]
# RDF ecosystem
oxrdf = { version = "0.3", features = ["serde"] }
spargebra = "0.4"
spareval = "0.2"

# Storage
fjall = "3.1.3"
postcard = { version = "1", features = ["alloc"] }

# Search
tantivy = "0.26"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identity
uuid = { version = "1.23.0", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Hashing
blake3 = "1.8.4"

# Error handling
thiserror = "2"
anyhow = "1"
globset = "0.4"

# RO-Crate implementation
rocraters = { package = "ro-crate-rs", git = "https://github.com/arunaengine/ro-crate-rs.git", branch = "feat/rdfperformance", features = [
    "rdf",
] }

# Testing
proptest = "1"
tempfile = "3"

[package]
name = "craqle"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["search"]
search = ["dep:tantivy"]

[dependencies]
blake3 = { workspace = true }
chrono = { workspace = true }
fjall = { workspace = true }
irokle = { path = "../../irokle", features = ["fjall"] }
oxrdf = { workspace = true }
postcard = { workspace = true }
rocraters = { workspace = true }
serde_json = { workspace = true }
spargebra = { workspace = true }
spareval = { workspace = true }
tantivy = { workspace = true, optional = true }
globset = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
criterion = "0.8.2"
proptest = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "partial_loading"
harness = false

[[bench]]
name = "large_rocrate_latency"
harness = false
