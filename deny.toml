[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "Unmaintained-only Iroh netlink dependency; no safe upstream upgrade exists." },
    { id = "RUSTSEC-2026-0173", reason = "Unmaintained-only Rudof table formatting dependency; no safe upstream upgrade exists." },
    { id = "RUSTSEC-2026-0194", reason = "Craqle exposes JSON-LD only and does not invoke the transitive RDF/XML or SPARQL-results XML parsers." },
    { id = "RUSTSEC-2026-0195", reason = "Craqle exposes JSON-LD only and does not invoke the transitive RDF/XML or SPARQL-results XML parsers." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "zlib-acknowledgement",
]
confidence-threshold = 0.8
